<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>仲良しTube v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040d0a; --bg2:#07150f;
    --panel:rgba(14,34,27,.66); --panel2:#10281f;
    --line:rgba(52,211,153,.14); --line2:rgba(52,211,153,.34);
    --txt:#e9fff7; --dim:#8cbaa8;
    --em:#10b981; --em2:#34d399; --em3:#6ee7b7; --deep:#047857;
    --gold:#f5d68a; --rad:20px;
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow:0 24px 50px -24px rgba(16,185,129,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--em);color:#022c1f}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(52,211,153,.25);border-radius:99px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.45)}

  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.45;animation:float 20s ease-in-out infinite}
  .aurora i:nth-child(1){width:620px;height:620px;background:#059669;top:-220px;left:-160px}
  .aurora i:nth-child(2){width:520px;height:520px;background:#0d9488;top:32%;right:-200px;animation-delay:-7s;opacity:.3}
  .aurora i:nth-child(3){width:420px;height:420px;background:#065f46;bottom:-180px;left:30%;animation-delay:-13s}
  .aurora::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(52,211,153,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.05) 1px,transparent 1px);
    background-size:52px 52px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%)}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.95)}}

  a{color:inherit;text-decoration:none;cursor:pointer}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--em2);outline-offset:3px;border-radius:8px}
  svg.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .app{display:flex;min-height:100vh}
  .rail{width:92px;flex:0 0 92px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:rgba(4,13,10,.6);backdrop-filter:blur(20px);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;z-index:30}
  .logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;cursor:pointer;margin-bottom:18px;
    background:linear-gradient(145deg,var(--em3),var(--em) 50%,var(--deep));
    box-shadow:0 0 0 1px rgba(110,231,183,.4),0 12px 30px -6px rgba(16,185,129,.7);transition:transform .5s var(--ease)}
  .logo:hover{transform:rotate(-8deg) scale(1.08)}
  .rbtn{position:relative;width:66px;padding:11px 4px 9px;border:0;border-radius:16px;background:transparent;color:var(--dim);
    cursor:pointer;font-size:10.5px;font-weight:700;display:grid;gap:5px;justify-items:center;transition:all .3s var(--ease)}
  .rbtn:hover{color:var(--txt);background:rgba(16,185,129,.08)}
  .rbtn.on{color:var(--em3);background:rgba(16,185,129,.14)}
  .rbtn.on::before{content:"";position:absolute;left:-12px;top:50%;width:4px;height:26px;margin-top:-13px;border-radius:0 4px 4px 0;
    background:var(--em2);box-shadow:0 0 14px var(--em2);animation:grow .4s var(--ease)}
  @keyframes grow{from{height:0;margin-top:0}}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  .topbar{position:sticky;top:0;z-index:20;display:flex;gap:18px;align-items:center;padding:14px 28px;
    backdrop-filter:blur(20px) saturate(1.4);background:rgba(4,13,10,.72);border-bottom:1px solid var(--line)}
  .brand{font-family:"Space Grotesk","Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:19px;white-space:nowrap;letter-spacing:.3px;cursor:pointer}
  .brand b{background:linear-gradient(90deg,var(--em3),var(--em));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand sup{font-size:10px;margin-left:4px;padding:2px 6px;border:1px solid var(--line2);border-radius:6px;color:var(--em3);vertical-align:middle}
  .searchwrap{flex:1;max-width:660px;display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;height:46px;position:relative;
    background:rgba(14,34,27,.7);border:1px solid var(--line);border-radius:14px;transition:all .3s var(--ease)}
  .searchwrap:focus-within{border-color:var(--em2);box-shadow:0 0 0 4px rgba(16,185,129,.15),0 10px 30px -10px rgba(16,185,129,.5)}
  .searchwrap>svg{color:var(--dim)}
  .searchwrap input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font-size:15px;font-family:inherit}
  .searchwrap button[type=submit]{height:34px;padding:0 16px;border:0;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:#022c1f;
    background:linear-gradient(135deg,var(--em3),var(--em));display:flex;align-items:center;gap:6px;transition:transform .2s,filter .2s}
  .searchwrap button[type=submit]:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .searchwrap button svg{width:16px;height:16px}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:rgba(7,21,15,.97);backdrop-filter:blur(14px);
    border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);z-index:40}
  .sugg div{padding:11px 16px;font-size:13.5px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:9px}
  .sugg div:hover{background:rgba(16,185,129,.12);color:var(--txt)}

  .content{padding:30px 32px 110px;max-width:1600px;width:100%}
  .page{animation:pageIn .5s var(--ease) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .hero{position:relative;padding:28px 30px;border-radius:26px;margin-bottom:26px;overflow:hidden;
    background:linear-gradient(120deg,rgba(16,185,129,.22),rgba(4,120,87,.08) 60%,transparent);border:1px solid var(--line)}
  .hero::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(110,231,183,.12),transparent);animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%{left:-40%}60%,100%{left:120%}}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:"Space Grotesk";font-size:11px;letter-spacing:2px;color:var(--em3);font-weight:700;text-transform:uppercase}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--em2);box-shadow:0 0 10px var(--em2);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
  h1.ttl{font-size:30px;font-weight:900;margin:8px 0 6px;display:flex;align-items:center;gap:12px;line-height:1.3}
  h1.ttl svg{width:28px;height:28px;color:var(--em2)}
  .sub{color:var(--dim);font-size:13.5px;margin:0}

  .sechead{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;margin:30px 0 16px}
  .sechead svg{color:var(--em2)}
  .sechead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease);
    animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.98)}}
  .card:hover{transform:translateY(-6px);border-color:var(--line2);box-shadow:0 22px 40px -18px rgba(16,185,129,.55)}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--panel2);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
  .card:hover .thumb img{transform:scale(1.07)}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(2,20,14,.7))}
  .play{position:absolute;left:50%;top:50%;z-index:2;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#022c1f;
    background:rgba(110,231,183,.95);transform:translate(-50%,-50%) scale(.5);opacity:0;transition:all .4s var(--ease);box-shadow:0 0 30px rgba(52,211,153,.7)}
  .play svg{width:22px;height:22px;fill:currentColor;stroke:none;margin-left:3px}
  .card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .badge{position:absolute;z-index:2;right:10px;bottom:10px;background:rgba(2,20,14,.85);backdrop-filter:blur(6px);color:var(--txt);
    font-family:"Space Grotesk";font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;gap:4px}
  .badge svg{width:13px;height:13px}
  .badge.short{left:10px;right:auto;top:10px;bottom:auto;background:var(--em);color:#022c1f;border:0}
  .fav-mini{position:absolute;z-index:3;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);
    background:rgba(2,20,14,.7);backdrop-filter:blur(6px);color:var(--txt);display:grid;place-items:center;cursor:pointer;
    opacity:0;transform:scale(.8);transition:all .3s var(--ease)}
  .card:hover .fav-mini,.fav-mini.on{opacity:1;transform:scale(1)}
  .fav-mini svg{width:16px;height:16px}
  .fav-mini.on{background:var(--em);color:#022c1f;border-color:var(--em)}
  .fav-mini.on svg{fill:currentColor}
  .cbody{padding:14px 15px 16px;display:flex;gap:11px}
  .av{width:36px;height:36px;border-radius:50%;flex:0 0 36px;background:var(--panel2);object-fit:cover;border:1px solid var(--line2)}
  .ct{font-size:14.5px;font-weight:700;line-height:1.45;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cm{font-size:12px;color:var(--dim);line-height:1.6}
  .cm a:hover{color:var(--em3)}

  .chrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .chcard{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--rad);cursor:pointer;
    background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(14,34,27,.7));border:1px solid var(--line);overflow:hidden;
    transition:all .4s var(--ease);animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
  .chcard:hover{transform:translateY(-4px);border-color:var(--em2);box-shadow:0 18px 36px -16px rgba(16,185,129,.6)}
  .chcard .pic{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:0 0 62px;background:var(--panel2);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--em)}
  .chcard .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chcard .go{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--em3);transition:all .3s var(--ease)}
  .chcard:hover .go{background:var(--em);color:#022c1f;transform:translateX(3px)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--em3);background:rgba(16,185,129,.14);padding:2px 8px;border-radius:999px;margin-top:4px}
  .tag svg{width:12px;height:12px}

  .watch{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:30px;align-items:start}
  .player{aspect-ratio:16/9;width:100%;border-radius:24px;overflow:hidden;background:#000;border:1px solid var(--line2);box-shadow:0 30px 80px -30px rgba(16,185,129,.55)}
  .player iframe{width:100%;height:100%;border:0;display:block}
  .vtitle{font-size:23px;font-weight:900;margin:20px 0 14px;line-height:1.4}
  .chanbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:var(--rad)}
  .chanbar img{width:48px;height:48px;border-radius:50%;border:2px solid var(--em);object-fit:cover}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.08);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:12px;color:var(--dim);font-weight:700}
  .chip svg{width:15px;height:15px}
  button.chip{cursor:pointer;transition:all .3s var(--ease)}
  button.chip:hover{border-color:var(--em2);color:var(--txt)}
  button.chip.on{background:var(--em);color:#022c1f;border-color:var(--em)}
  button.chip.on svg{fill:currentColor}
  button.chip:active{transform:scale(.94)}
  .desc{white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px;margin-top:16px;font-size:13.5px;line-height:1.8;color:#c5e8da;max-height:220px;overflow:auto}
  .side .card{flex-direction:row;margin-bottom:12px}
  .side .thumb{width:170px;flex:0 0 170px}
  .side .cbody{padding:9px 11px}
  .side .ct{font-size:13px}
  .side .play,.side .fav-mini{display:none}
  .cmt{display:flex;gap:13px;padding:16px;margin-bottom:10px;border-radius:16px;background:rgba(14,34,27,.45);border:1px solid transparent;transition:border-color .3s}
  .cmt:hover{border-color:var(--line)}
  .cmt img{width:40px;height:40px;border-radius:50%;flex:0 0 40px;object-fit:cover;background:var(--panel2)}
  .cmt .body{font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .cmt .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--em3);font-weight:700;margin-bottom:4px}
  .cmt .who svg{width:13px;height:13px}
  .owner{color:var(--gold)!important}
  .likes{display:flex;align-items:center;gap:5px;margin-top:8px}
  .likes svg{width:14px;height:14px}

  .banner{width:100%;height:210px;object-fit:cover;border-radius:24px;border:1px solid var(--line);display:block}
  .chanhead{display:flex;align-items:flex-end;gap:20px;padding:0 22px 8px;margin-top:-52px;position:relative;flex-wrap:wrap}
  .chanhead img.pic{width:112px;height:112px;border-radius:50%;border:5px solid var(--bg);object-fit:cover;box-shadow:0 0 0 2px var(--em),0 20px 40px -10px rgba(16,185,129,.6)}
  .empty{color:var(--dim);padding:70px 0;text-align:center;display:grid;justify-items:center;gap:12px}
  .empty svg{width:44px;height:44px;color:var(--em);opacity:.7}
  .retry{margin-top:6px;padding:10px 20px;border-radius:12px;border:1px solid var(--line2);background:rgba(16,185,129,.12);color:var(--em3);font-weight:700;cursor:pointer;transition:all .3s var(--ease)}
  .retry:hover{background:var(--em);color:#022c1f}
  .loader{display:flex;justify-content:center;gap:8px;padding:40px 0}
  .loader i{width:11px;height:11px;border-radius:50%;background:var(--em2);animation:bounce 1s var(--ease) infinite}
  .loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-14px);opacity:1;box-shadow:0 0 16px var(--em2)}}
  .skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px}
  .skel{border-radius:var(--rad);height:252px;background:linear-gradient(100deg,var(--panel2) 30%,rgba(52,211,153,.12) 50%,var(--panel2) 70%);background-size:300% 100%;animation:sk 1.4s linear infinite}
  @keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
  #sentinel{height:1px}
  .endmsg{text-align:center;color:var(--dim);font-size:12.5px;padding:34px 0 10px;font-family:"Space Grotesk";letter-spacing:2px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:200;padding:12px 20px;border-radius:14px;
    background:rgba(7,21,15,.95);border:1px solid var(--line2);color:var(--txt);font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .35s var(--ease)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .totop{position:fixed;right:22px;bottom:26px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);
    background:rgba(7,21,15,.9);backdrop-filter:blur(10px);color:var(--em3);display:grid;place-items:center;cursor:pointer;
    opacity:0;pointer-events:none;transition:all .35s var(--ease)}
  .totop.show{opacity:1;pointer-events:auto}
  .totop:hover{background:var(--em);color:#022c1f}
  .totop svg{transform:rotate(-90deg)}

  .login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(2,10,7,.6);backdrop-filter:blur(8px)}
  .login.hide{animation:fadeOut .45s var(--ease) forwards}
  @keyframes fadeOut{to{opacity:0;visibility:hidden}}
  .lcard{position:relative;width:100%;max-width:420px;padding:38px 36px;border-radius:24px;background:rgba(10,28,21,.9);
    border:1px solid var(--line2);box-shadow:0 0 80px -20px rgba(16,185,129,.6);animation:cardIn .7s var(--ease) both;overflow:hidden}
  .lcard::before{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-80px;border-radius:50%;background:var(--em);filter:blur(80px);opacity:.45;animation:float 12s infinite}
  .lcard h2{position:relative;text-align:center;margin:0;font-family:"Space Grotesk";font-size:28px;letter-spacing:1px}
  .lcard h2 b{color:var(--em2)}
  .lcard .lsub{text-align:center;color:var(--dim);font-size:13px;margin:6px 0 22px}
  .divider{display:flex;align-items:center;gap:12px;font-family:"Space Grotesk";font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:22px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
  .flabel{font-family:"Space Grotesk";font-size:11px;letter-spacing:2px;color:var(--em3);margin-bottom:8px;display:block}
  .field{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:12px;background:rgba(2,10,7,.7);border:1px solid var(--line);transition:all .3s var(--ease);color:var(--dim)}
  .field:focus-within{border-color:var(--em2);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
  .field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:15px;font-family:inherit}
  .field button{background:none;border:0;color:var(--dim);cursor:pointer;display:grid}
  .lrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 22px;font-size:13px;color:var(--dim)}
  .lrow label{display:flex;gap:8px;align-items:center;cursor:pointer}
  .lrow input{accent-color:var(--em)}
  .lbtn{width:100%;height:50px;border:0;border-radius:12px;cursor:pointer;font-weight:900;font-size:16px;color:#022c1f;
    background:linear-gradient(135deg,var(--em3),var(--em));transition:all .3s var(--ease)}
  .lbtn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(16,185,129,.8)}
  .lerr{color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:10px;text-align:center}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

  .home{text-align:center;padding:26px 0 10px;position:relative}
  .bigbrand{display:inline-flex;align-items:center;gap:6px;font-family:"Space Grotesk";font-size:clamp(38px,7vw,64px);font-weight:700;margin:20px 0 6px}
  .bigbrand .box{padding:2px 18px;border-radius:14px;color:#022c1f;background:linear-gradient(145deg,var(--em3),var(--em));box-shadow:0 0 50px -6px rgba(16,185,129,.8);animation:glow 3.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 80px 0 rgba(16,185,129,.9)}}
  .bigbrand .rest{background:linear-gradient(90deg,var(--txt),var(--em3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .home .tag2{color:var(--dim);margin:0 0 30px}
  .homesearch{max-width:660px;margin:0 auto 42px;height:54px}

<script>
"use strict";
const API = "https://dark-sun-c226.c00lkimx01.workers.dev/api/v1";
const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, st="") => `<svg class="ic" ${st?`style="${st}"`:""}><use href="#i-${n}"/></svg>`;
const $ = id => document.getElementById(id);
const go = h => { location.hash = h && h !== "#" ? h : "#/"; };
const focusSearch = () => { const q=$("q"); if(q){ q.focus(); q.select(); } };

/* ---------- safe storage (private mode / quota errors) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  json(k, d){ try{ const v = JSON.parse(localStorage.getItem(k) || "null"); return Array.isArray(v)||v&&typeof v==="object" ? v : d; }catch(e){ return d; } }
};

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t = $("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- API with timeout + retry + readable errors ---------- */
async function api(path, {retries=1, timeout=15000} = {}){
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(API + path, { signal: ctl.signal });
      const text = await r.text();
      let data = null;
      try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
      if(!r.ok) throw new Error((data && data.error) || `サーバーエラー (${r.status})`);
      if(data && data.error) throw new Error(String(data.error).slice(0,140));
      if(data === null) throw new Error("応答を読み取れませんでした");
      return data;
    }catch(e){
      lastErr = e && e.name === "AbortError" ? new Error("通信がタイムアウトしました") : e;
      if(attempt < retries) await new Promise(r=>setTimeout(r, 700 * (attempt+1)));
    }finally{ clearTimeout(timer); }
  }
  throw lastErr || new Error("不明なエラー");
}

/* ---------- formatters (all null-safe) ---------- */
const num = n => typeof n === "number" && isFinite(n) ? n.toLocaleString("ja-JP") : null;
function dur(s){
  const n = Number(s); if(!isFinite(n) || n <= 0) return "";
  const t=Math.floor(n), h=Math.floor(t/3600), m=Math.floor(t%3600/60), x=t%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");
}
function views(v){ if(!v) return ""; if(v.viewCountText) return v.viewCountText; return v.viewCount ? (num(v.viewCount)||v.viewCount)+"回視聴" : ""; }
const fixUrl = u => typeof u === "string" && u.startsWith("//") ? "https:"+u : (u || "");
const thumbOf = v => fixUrl((v && (v.thumbnail || (Array.isArray(v.videoThumbnails) && v.videoThumbnails[0] && v.videoThumbnails[0].url))) ||
  (v && v.videoId ? `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg` : ""));
const avOf = o => { const t = o && o.authorThumbnails; return fixUrl(Array.isArray(t) && t.length ? t[t.length-1].url : ""); };
const listOf = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  const k = ["results","videos","latestVideos","contents","items","relatedStreams"].find(k=>Array.isArray(d[k]));
  return k ? d[k] : [];
};
const IMGFAIL = "this.onerror=null;this.style.visibility='hidden'";

/* ---------- favourites / history ---------- */
const favKey = "nakayoshi_fav_v2", histKey = "nakayoshi_hist_v2";
const favs = () => store.json(favKey, []).filter(v=>v && v.videoId);
const isFav = id => favs().some(f=>f.videoId===id);
function saveFav(v){
  if(!v || !v.videoId) return false;
  const on = isFav(v.videoId);
  const next = on ? favs().filter(x=>x.videoId!==v.videoId) : [v, ...favs()];
  store.set(favKey, JSON.stringify(next.slice(0,300)));
  return !on;
}
const hist = () => store.json(histKey, []).filter(v=>v && v.videoId);
function addHist(v){
  if(!v || !v.videoId) return;
  store.set(histKey, JSON.stringify([v, ...hist().filter(x=>x.videoId!==v.videoId)].slice(0,120)));
}
const slim = v => ({videoId:v.videoId, title:v.title, author:v.author, authorId:v.authorId, thumbnail:thumbOf(v), lengthSeconds:v.lengthSeconds});

/* ---------- card templates ---------- */
function channelCardHTML(c, i=0){
  if(!c || !c.authorId) return "";
  return `<div class="chcard" style="--i:${i}" data-go="#/channel/${esc(c.authorId)}">
    ${c.pic?`<img class="pic" src="${esc(fixUrl(c.pic))}" alt="" loading="lazy" onerror="${IMGFAIL}">`:`<div class="pic" style="display:grid;place-items:center">${ic("user")}</div>`}
    <div style="min-width:0">
      <div class="nm">${esc(c.author||"チャンネル")}</div>
      <div class="cm">${c.subs?esc(c.subs):(c.count?"検索結果に "+c.count+" 本":"")}</div>
      <span class="tag">${ic("users")}チャンネル</span>
    </div>
    <div class="go">${ic("arrow","width:16px;height:16px")}</div>
  </div>`;
}
function cardHTML(v, i=0){
  if(!v || typeof v !== "object") return "";
  if(v.type==="channel" || (v.authorId && !v.videoId && !v.playlistId)){
    return channelCardHTML({authorId:v.authorId, author:v.author||v.title, pic:avOf(v), subs:v.subCountText}, i);
  }
  if(v.playlistId){
    return `<div class="card" style="--i:${i}" data-go="#/playlist/${esc(v.playlistId)}">
      <div class="thumb"><img loading="lazy" src="${esc(thumbOf(v))}" alt="" onerror="${IMGFAIL}"><div class="play">${ic("play")}</div>
        <span class="badge">${ic("list")}${esc(v.videoCount||"")}</span></div>
      <div class="cbody"><div style="min-width:0"><p class="ct">${esc(v.title||"プレイリスト")}</p><div class="cm">${esc(v.author||"")}</div></div></div></div>`;
  }
  if(!v.videoId) return "";
  const fav = isFav(v.videoId);
  return `<div class="card" style="--i:${i}" data-go="#/watch/${esc(v.videoId)}">
    <div class="thumb"><img loading="lazy" src="${esc(thumbOf(v))}" alt="" onerror="${IMGFAIL}">
      <div class="play">${ic("play")}</div>
      <button class="fav-mini ${fav?"on":""}" data-fav="${esc(v.videoId)}" aria-label="お気に入り">${ic("star")}</button>
      ${v.isShort?'<span class="badge short">SHORT</span>':""}
      ${dur(v.lengthSeconds)?`<span class="badge">${dur(v.lengthSeconds)}</span>`:""}</div>
    <div class="cbody">
      ${avOf(v)?`<img class="av" src="${esc(avOf(v))}" alt="" loading="lazy" onerror="${IMGFAIL}">`:""}
      <div style="min-width:0">
        <p class="ct">${esc(v.title||"（タイトルなし）")}</p>
        <div class="cm">${v.authorId?`<a data-go="#/channel/${esc(v.authorId)}" data-stop="1">${esc(v.author||"")}</a>`:esc(v.author||"")}</div>
        <div class="cm">${[views(v), v.publishedText||""].filter(Boolean).map(esc).join(" ・ ")}</div>
      </div>
    </div></div>`;
}
const emptyHTML = (t, retry) => `<div class="empty">${ic("empty")}<div>${t}</div>${retry?`<button class="retry" data-act="reload">もう一度試す</button>`:""}</div>`;
const gridHTML = arr => (arr&&arr.length) ? `<div class="grid">${arr.map((v,i)=>cardHTML(v,i)).join("")}</div>` : emptyHTML("なにも見つかりませんでした");
const loading = () => { view.innerHTML = `<div class="page"><div class="skgrid">${'<div class="skel"></div>'.repeat(9)}</div></div>`; };
const fail = e => { view.innerHTML = `<div class="page">${emptyHTML(`読み込みに失敗しました<br><small>${esc((e&&e.message)||e||"")}</small>`, true)}</div>`; };
function setNav(k){ document.querySelectorAll(".rbtn").forEach(b=>b.classList.toggle("on", b.dataset.nav===k)); }
const hero = (eyebrow, icon, title, sub, extra="") => `<div class="hero"><span class="eyebrow"><span class="dot"></span>${eyebrow}</span>
  <h1 class="ttl">${ic(icon)}${title}</h1><p class="sub">${sub}</p>${extra}</div>`;

/* ---------- infinite scroll engine ---------- */
let scrollToken = 0, io = null, feed = null;
function stopFeed(){
  scrollToken++;
  if(io){ io.disconnect(); io = null; }
  feed = null;
}
/**
 * mount an infinite feed.
 * loadMore() -> { items: [], done: boolean }
 */
function mountFeed(loadMore, seenIds){
  const token = scrollToken;
  const gridEl = view.querySelector(".grid");
  if(!gridEl) return;
  const sentinel = document.createElement("div"); sentinel.id = "sentinel";
  const status = document.createElement("div"); status.id = "feedstatus";
  gridEl.after(status); status.after(sentinel);
  feed = { token, busy:false, done:false, count:gridEl.children.length, seen:new Set(seenIds||[]) };

  async function pump(){
    if(!feed || feed.token !== token || feed.busy || feed.done) return;
    feed.busy = true;
    status.innerHTML = `<div class="loader"><i></i><i></i><i></i></div>`;
    try{
      const res = await loadMore();
      if(!feed || feed.token !== token) return;
      const fresh = (res && res.items || []).filter(v=>{
        const key = v && (v.videoId || v.playlistId || v.authorId);
        if(!key || feed.seen.has(key)) return false;
        feed.seen.add(key); return true;
      });
      if(fresh.length){
        gridEl.insertAdjacentHTML("beforeend", fresh.map((v,i)=>cardHTML(v, Math.min(i,10))).join(""));
        feed.count += fresh.length;
      }
      feed.done = !!(res && res.done) || (!fresh.length && !(res && res.retry));
      status.innerHTML = feed.done ? `<div class="endmsg">— ALL LOADED · ${feed.count} ITEMS —</div>` : "";
    }catch(e){
      if(!feed || feed.token !== token) return;
      status.innerHTML = `<div class="empty" style="padding:30px 0">${ic("empty")}<div>追加の読み込みに失敗しました<br><small>${esc(e.message||"")}</small></div><button class="retry" data-act="more">もう一度読み込む</button></div>`;
    }finally{
      if(feed && feed.token === token) feed.busy = false;
      if(feed && feed.token === token && !feed.done) requestAnimationFrame(check);
    }
  }
  function check(){
    if(!feed || feed.done || feed.busy) return;
    const r = sentinel.getBoundingClientRect();
    if(r.top < window.innerHeight * 1.5) pump();
  }
  feed.pump = pump;
  io = new IntersectionObserver(entries=>{ if(entries.some(e=>e.isIntersecting)) pump(); }, {rootMargin:"600px 0px"});
  io.observe(sentinel);
  requestAnimationFrame(check);
}
// local (client-side) pagination for arrays already in memory
function localPager(all, size=15){
  let i = 0;
  return async () => { const items = all.slice(i, i+size); i += items.length; return { items, done: i >= all.length }; };
}

/* ---------- pages ---------- */
async function pageTrending(){
  setNav("trending"); loading(); const token = ++scrollToken;
  try{
    const d = await api("/trending");
    if(token !== scrollToken) return;
    const all = listOf(d).filter(Boolean);
    const first = all.slice(0, 15);
    view.innerHTML = `<div class="page">${hero("Trending now","flame","いま人気の動画","仲良しTube v2 がえらんだ、みんなが見ている動画。スクロールでもっと表示されます。")}${gridHTML(first)}</div>`;
    if(all.length > first.length) mountFeed(localPager(all.slice(first.length)), first.map(v=>v.videoId));
  }catch(e){ if(token === scrollToken) fail(e); }
}

async function pageSearch(q){
  setNav("search"); const box = $("q"); if(box) box.value = q;
  loading(); const token = ++scrollToken;
  try{
    const d = await api("/search?q="+encodeURIComponent(q));
    if(token !== scrollToken) return;
    const all = listOf(d);
    const chans = new Map();
    all.filter(x=>x && x.type==="channel" && x.authorId).forEach(c=>chans.set(c.authorId,{authorId:c.authorId,author:c.author||c.title,pic:avOf(c),subs:c.subCountText}));
    const counts = {};
    all.forEach(v=>{ if(v && v.authorId && v.type!=="channel"){ counts[v.authorId] = counts[v.authorId] || {authorId:v.authorId,author:v.author,count:0,pic:avOf(v)}; counts[v.authorId].count++; }});
    Object.values(counts).sort((a,b)=>b.count-a.count).forEach(c=>{ if(!chans.has(c.authorId)) chans.set(c.authorId, c); });
    const chanList = [...chans.values()].slice(0,6);
    const videos = all.filter(x=>x && x.type!=="channel");
    view.innerHTML = `<div class="page">
      ${hero("Search results","search",`「${esc(q)}」`, `${videos.length} 本の動画と ${chanList.length} 件のチャンネル。スクロールでさらに読み込みます。`)}
      ${chanList.length?`<div class="sechead">${ic("users")}チャンネル</div><div class="chrow" id="chrow">${chanList.map(channelCardHTML).join("")}</div>`:""}
      <div class="sechead">${ic("video")}動画</div>${gridHTML(videos)}</div>`;

    let cont = d && d.continuation, page = 1;
    mountFeed(async () => {
      let data;
      if(cont){
        data = await api("/search?q="+encodeURIComponent(q)+"&continuation="+encodeURIComponent(cont));
        cont = data && data.continuation;
      }else{
        page++;
        data = await api("/search?q="+encodeURIComponent(q)+"&page="+page);
      }
      const items = listOf(data).filter(x=>x && x.type!=="channel");
      return { items, done: (!cont && !items.length) || page > 12 };
    }, videos.map(v=>v.videoId||v.playlistId).filter(Boolean));

    chanList.forEach(async (c,i)=>{
      if(c.pic && c.subs) return;
      try{
        const info = await api(`/channels/${encodeURIComponent(c.authorId)}?tab=videos&sort=latest`, {retries:0});
        if(token !== scrollToken) return;
        c.pic = c.pic || avOf(info);
        if(info.subCount) c.subs = "登録者 " + (num(info.subCount)||info.subCount) + "人";
        const row = $("chrow"); if(!row) return;
        const el = row.children[i]; if(!el) return;
        const tmp = document.createElement("div"); tmp.innerHTML = channelCardHTML(c,0);
        const n = tmp.firstElementChild; if(!n) return;
        n.style.animation = "none"; el.replaceWith(n);
      }catch(e){ /* enrichment is optional */ }
    });
  }catch(e){ if(token === scrollToken) fail(e); }
}

async function pageWatch(id){
  setNav(""); loading(); const token = ++scrollToken;
  if(!id) return fail(new Error("動画IDがありません"));
  try{
    const v = await api("/videos/"+encodeURIComponent(id));
    if(token !== scrollToken) return;
    const vid = v.videoId || id;
    const rec = Array.isArray(v.recommendedVideos) ? v.recommendedVideos : [];
    const fav = isFav(vid);
    view.innerHTML = `<div class="page watch">
      <div>
        <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}?autoplay=1&rel=0&playsinline=1" title="${esc(v.title||"動画")}" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <h1 class="vtitle">${esc(v.title||"（タイトルなし）")}</h1>
        <div class="chanbar">
          ${avOf(v)?`<img src="${esc(avOf(v))}" alt="" onerror="${IMGFAIL}">`:""}
          <div style="min-width:0;flex:1">
            ${v.authorId?`<a style="font-weight:900" data-go="#/channel/${esc(v.authorId)}">${esc(v.author||"")}</a>`:`<span style="font-weight:900">${esc(v.author||"")}</span>`}
            <div class="cm">${esc(v.subCountText||"")}</div>
          </div>
          ${views(v)?`<span class="chip">${ic("eye")}${esc(views(v))}</span>`:""}
          ${v.publishedText?`<span class="chip">${ic("clock")}${esc(v.publishedText)}</span>`:""}
          <button class="chip ${fav?"on":""}" id="favbtn" data-fav-full="${esc(vid)}">${ic("star")}<span>${fav?"登録済み":"お気に入り"}</span></button>
        </div>
        ${v.description?`<div class="desc">${esc(v.description)}</div>`:""}
        <div class="sechead">${ic("chat")}コメント ${v.commentCount?"("+(num(v.commentCount)||v.commentCount)+")":""}</div>
        <div id="comments"><div class="loader"><i></i><i></i><i></i></div></div>
      </div>
      <aside class="side">
        <div class="sechead" style="margin-top:0">${ic("sparkle")}次のおすすめ</div>
        <div class="grid" style="grid-template-columns:1fr">${rec.map((r,i)=>cardHTML(r,i)).join("")}</div>
        ${rec.length?"":emptyHTML("おすすめはありません")}
      </aside>
    </div>`;
    window.__favPayload = slim(Object.assign({videoId:vid}, v));
    addHist(window.__favPayload);
    loadComments(vid, v.comments, token);
  }catch(e){ if(token === scrollToken) fail(e); }
}
async function loadComments(id, pre, token){
  const box = $("comments"); if(!box) return;
  try{
    let list = Array.isArray(pre) && pre.length ? pre : listOf(await api("/comments/"+encodeURIComponent(id), {retries:0}));
    if(!Array.isArray(list)) list = [];
    if(token !== scrollToken || !document.body.contains(box)) return;
    box.innerHTML = list.length ? list.slice(0,60).map(c=>`<div class="cmt">
      ${avOf(c)?`<img src="${esc(avOf(c))}" alt="" loading="lazy" onerror="${IMGFAIL}">`:`<div class="cmt-ph" style="width:40px;height:40px;border-radius:50%;background:var(--panel2);flex:0 0 40px"></div>`}
      <div style="min-width:0">
        <div class="who ${c.authorIsChannelOwner?"owner":""}">${esc(c.author||"")} ${c.isPinned?ic("pin"):""} <span style="color:var(--dim);font-weight:400">${esc(c.publishedText||"")}</span></div>
        <div class="body">${esc(c.content||"")}</div>
        <div class="cm likes">${ic("thumb")}${esc(c.likeCount||0)}${c.replyCount?" ・ 返信 "+esc(c.replyCount):""}</div>
      </div></div>`).join("") : emptyHTML("コメントはありません");
  }catch(e){
    if(document.body.contains(box)) box.innerHTML = emptyHTML("コメントを取得できませんでした");
  }
}

async function pageChannel(cid){
  setNav(""); loading(); const token = ++scrollToken;
  if(!cid) return fail(new Error("チャンネルIDがありません"));
  try{
    const d = await api(`/channels/${encodeURIComponent(cid)}?tab=videos&sort=latest`);
    if(token !== scrollToken) return;
    const banners = Array.isArray(d.authorBanners) ? d.authorBanners : [];
    const banner = banners.length ? banners[banners.length-1].url : "";
    const pic = avOf(d);
    const vids = listOf(d);
    view.innerHTML = `<div class="page">
      ${banner?`<img class="banner" src="${esc(fixUrl(banner))}" alt="" onerror="${IMGFAIL}">`:`<div class="banner" style="background:linear-gradient(120deg,var(--deep),var(--em),var(--em3))"></div>`}
      <div class="chanhead">
        ${pic?`<img class="pic" src="${esc(fixUrl(pic))}" alt="" onerror="${IMGFAIL}">`:""}
        <div>
          <h1 class="ttl" style="margin:0">${esc(d.author||"チャンネル")}</h1>
          <p class="sub" style="margin:6px 0 0">${d.subCount?"登録者 "+(num(d.subCount)||d.subCount)+"人":""}${d.totalViews?" ・ 総再生 "+(num(d.totalViews)||d.totalViews):""}${d.joined?" ・ 開設 "+esc(new Date(d.joined*1000).toLocaleDateString("ja-JP")):""}</p>
        </div>
      </div>
      ${d.description?`<div class="desc" style="max-height:150px">${esc(d.description)}</div>`:""}
      <div class="sechead">${ic("sparkle")}新着動画</div>
      ${gridHTML(vids)}</div>`;
    let cont = d && d.continuation;
    if(cont && vids.length){
      mountFeed(async () => {
        if(!cont) return { items: [], done: true };
        const data = await api(`/channels/${encodeURIComponent(cid)}?tab=videos&sort=latest&continuation=${encodeURIComponent(cont)}`, {retries:0});
        cont = data && data.continuation;
        const items = listOf(data);
        return { items, done: !cont || !items.length };
      }, vids.map(v=>v.videoId).filter(Boolean));
    }
  }catch(e){ if(token === scrollToken) fail(e); }
}

async function pagePlaylist(pid){
  setNav(""); loading(); const token = ++scrollToken;
  try{
    const d = await api("/playlists/"+encodeURIComponent(pid));
    if(token !== scrollToken) return;
    const all = listOf(d);
    const first = all.slice(0,15);
    view.innerHTML = `<div class="page">${hero("Playlist","list",esc(d.title||"プレイリスト"),`${esc(d.author||"")}${d.videoCount?" ・ "+esc(d.videoCount)+"本":""}`)}${gridHTML(first)}</div>`;
    if(all.length > first.length) mountFeed(localPager(all.slice(first.length)), first.map(v=>v.videoId));
  }catch(e){ if(token === scrollToken) fail(e); }
}

function pageList(kind){
  setNav(kind); ++scrollToken;
  const all = kind === "fav" ? favs() : hist();
  const meta = kind === "fav"
    ? ["Favorites","star","お気に入り","この端末に保存した動画です。"]
    : ["History","history","視聴履歴","最近見た動画です。"];
  const first = all.slice(0,15);
  view.innerHTML = `<div class="page">${hero(meta[0],meta[1],meta[2],meta[3],
    all.length?`<button class="retry" style="margin-top:14px" data-act="clear-${kind}">${ic("trash")} すべて消去</button>`:"")}
    ${gridHTML(first)}</div>`;
  if(all.length > first.length) mountFeed(localPager(all.slice(first.length)), first.map(v=>v.videoId));
}

function pageHome(){
  setNav("home"); ++scrollToken;
  let n = parseInt(store.get("nk_count","0"), 10); if(!isFinite(n) || n < 0) n = 0;
  n++; store.set("nk_count", String(n));
  const digits = String(n).padStart(6,"0").split("").map((d,i)=>`<i style="--i:${i}">${esc(d)}</i>`).join("");
  const tiles = [["flame","トレンド","人気動画をチェック","#/trending"],["search","さがす","動画・チャンネル検索","search"],
    ["star","お気に入り","保存した動画","#/fav"],["history","履歴","最近見た動画","#/history"],["logout","ログアウト","アクセスを終了","logout"]];
  const recent = hist().slice(0,8);
  const keywords = ["音楽","ゲーム実況","ライブ","作業用BGM","アニメ","お笑い"];
  view.innerHTML = `<div class="page home">
    <div class="counter"><small>TOTAL ACCESS</small><div class="digits">${digits}</div></div>
    <div class="bigbrand"><span class="box">仲良し</span><span class="rest">Tube v2</span></div>
    <p class="tag2">なかまと一緒に、動画をもっと楽しもう</p>
    <form class="searchwrap homesearch" id="homesearch" autocomplete="off">
      <svg class="ic"><use href="#i-search"/></svg><input name="hq" placeholder="動画・チャンネルを検索" autocomplete="off">
      <button type="submit"><svg class="ic"><use href="#i-arrow"/></svg><span>検索</span></button></form>
    <div class="quick">${keywords.map(k=>`<button data-search="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <div class="tiles">${tiles.map((t,i)=>`<div class="tile" style="--i:${i}" ${t[3]==="logout"?'data-act="logout"':t[3]==="search"?'data-act="focus-home"':`data-go="${t[3]}"`}>
      <div class="ib">${ic(t[0])}</div><b>${esc(t[1])}</b><span>${esc(t[2])}</span></div>`).join("")}</div>
    ${recent.length?`<div style="text-align:left"><div class="sechead">${ic("history")}つづきを見る</div>${gridHTML(recent)}</div>`:""}
  </div>`;
}

/* ---------- login ---------- */
const PASSWORD = "nkys";
const authed = () => { try{ return localStorage.getItem("nk_auth")==="1" || sessionStorage.getItem("nk_auth")==="1"; }catch(e){ return false; } };
function showLogin(){
  const l = $("login"); if(!l) return;
  l.classList.remove("hide"); l.style.display = "grid";
  setTimeout(()=>{ const p = $("pw"); if(p) p.focus(); }, 120);
}
function logout(){
  store.del("nk_auth"); try{ sessionStorage.removeItem("nk_auth"); }catch(e){}
  stopFeed(); view.innerHTML = ""; showLogin();
}
$("lcard").addEventListener("submit", e => {
  e.preventDefault();
  const pw = $("pw"), card = $("lcard");
  if(pw.value.trim() === PASSWORD){
    try{ ($("keep").checked ? localStorage : sessionStorage).setItem("nk_auth","1"); }catch(e){}
    const l = $("login"); l.classList.add("hide"); setTimeout(()=>{ l.style.display = "none"; }, 430);
    pw.value = ""; $("lerr").textContent = ""; render();
  }else{
    $("lerr").textContent = "パスワードが違います";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
});
$("pwtoggle").addEventListener("click", () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; p.focus(); });

/* ---------- search box + recent keywords ---------- */
const kwKey = "nakayoshi_kw_v2";
const kws = () => store.json(kwKey, []).filter(x=>typeof x === "string");
function addKw(k){ store.set(kwKey, JSON.stringify([k, ...kws().filter(x=>x!==k)].slice(0,8))); }
function doSearch(v){
  const q = String(v||"").trim();
  if(!q) { toast("検索キーワードを入力してください"); return; }
  addKw(q); hideSugg(); go("#/search/"+encodeURIComponent(q));
}
function hideSugg(){ const s = $("sugg"); if(s){ s.hidden = true; s.innerHTML = ""; } }
function showSugg(){
  const s = $("sugg"), list = kws(); if(!s) return;
  if(!list.length) return hideSugg();
  s.innerHTML = list.map(k=>`<div data-search="${esc(k)}">${ic("history")}${esc(k)}</div>`).join("");
  s.hidden = false;
}
$("topsearch").addEventListener("submit", e => { e.preventDefault(); doSearch($("q").value); });
$("q").addEventListener("focus", showSugg);
document.addEventListener("click", e => { if(!e.target.closest("#topsearch")) hideSugg(); });

/* ---------- global delegated events (no inline handlers) ---------- */
document.addEventListener("click", e => {
  const favMini = e.target.closest("[data-fav]");
  if(favMini){
    e.preventDefault(); e.stopPropagation();
    const id = favMini.dataset.fav;
    const card = favMini.closest(".card");
    const titleEl = card && card.querySelector(".ct");
    const imgEl = card && card.querySelector(".thumb img");
    const on = saveFav({videoId:id, title:titleEl?titleEl.textContent:"", thumbnail:imgEl?imgEl.getAttribute("src"):""});
    favMini.classList.toggle("on", on);
    toast(on ? "お気に入りに追加しました" : "お気に入りから削除しました");
    return;
  }
  const favFull = e.target.closest("[data-fav-full]");
  if(favFull){
    e.preventDefault();
    const on = saveFav(window.__favPayload || {videoId:favFull.dataset.favFull});
    favFull.classList.toggle("on", on);
    const sp = favFull.querySelector("span"); if(sp) sp.textContent = on ? "登録済み" : "お気に入り";
    toast(on ? "お気に入りに追加しました" : "お気に入りから削除しました");
    return;
  }
  const kw = e.target.closest("[data-search]");
  if(kw){ e.preventDefault(); doSearch(kw.dataset.search); return; }

  const act = e.target.closest("[data-act]");
  if(act){
    e.preventDefault();
    const a = act.dataset.act;
    if(a === "logout") logout();
    else if(a === "focus") focusSearch();
    else if(a === "focus-home"){ const i = document.querySelector(".homesearch input"); if(i) i.focus(); else focusSearch(); }
    else if(a === "reload") render();
    else if(a === "more" && feed && feed.pump) feed.pump();
    else if(a === "clear-fav"){ store.del(favKey); toast("お気に入りを消去しました"); render(); }
    else if(a === "clear-history"){ store.del(histKey); toast("履歴を消去しました"); render(); }
    return;
  }
  const nav = e.target.closest("[data-go]");
  if(nav){
    e.preventDefault();
    if(nav.dataset.stop) e.stopPropagation();
    go(nav.dataset.go);
  }
});
document.addEventListener("submit", e => {
  if(e.target.id === "homesearch"){ e.preventDefault(); doSearch(e.target.hq.value); }
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); focusSearch(); }
  if(e.key === "Escape") hideSugg();
});

/* back-to-top */
const totop = $("totop");
window.addEventListener("scroll", () => { totop.classList.toggle("show", window.scrollY > 700); }, {passive:true});
totop.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

/* ---------- router ---------- */
function render(){
  stopFeed();
  if(!authed()){ showLogin(); return; }
  const l = $("login"); if(l && l.style.display !== "none"){ l.style.display = "none"; }
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/");
  const p = parts[0];
  let a = parts.slice(1).join("/");
  try{ a = decodeURIComponent(a); }catch(err){ /* keep raw */ }
  document.title = p ? `仲良しTube v2 — ${p}` : "仲良しTube v2";
  try{
    if(p === "search") return pageSearch(a);
    if(p === "watch") return pageWatch(a);
    if(p === "channel") return pageChannel(a);
    if(p === "playlist") return pagePlaylist(a);
    if(p === "fav") return pageList("fav");
    if(p === "history") return pageList("history");
    if(p === "trending") return pageTrending();
    return pageHome();
  }catch(err){ fail(err); }
}
window.addEventListener("hashchange", () => { window.scrollTo({top:0, behavior:"auto"}); render(); });
window.addEventListener("error", e => { console.error("[app]", e.message); });
window.addEventListener("unhandledrejection", e => { console.error("[app]", e.reason); });
render();
</script>
